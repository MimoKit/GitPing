# 插件常被单独打开，读不到 Core 仓库根配置，因此自带一份。
target-version = "py311"
line-length = 110
exclude = ["__pycache__", ".git", "resources"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # 插件的异常处理需要给出可读提示，允许捕获宽泛异常
    "BLE001",
    # f-string 里的引号嵌套在拼 HTML 时很常见
    "Q000",
]

[lint.per-file-ignores]
# cards.py 大量拼接 HTML 字符串，行内引号嵌套难以避免
"GitPing/gitping_render/cards.py" = ["E501"]

[format]
quote-style = "double"
indent-style = "space"
